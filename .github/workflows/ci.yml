name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go test ./...
        working-directory: app
      - run: go build -trimpath -ldflags "-H windowsgui -s -w" -o ../TryArch.exe .
        working-directory: app
  guest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash scripts/release/build-guest.sh --contract-only
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 runtime-build/validate-lock.py
