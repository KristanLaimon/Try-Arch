name: Build Try Arch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go test ./...
        working-directory: app
      - run: go build -trimpath -ldflags "-H windowsgui -s -w" -o ../TryArch.exe .
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TryArch-launcher
          path: TryArch.exe
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash scripts/release/build-guest.sh --contract-only
      - run: bash scripts/release/build-guest.sh --output artifacts/arch-guest
      - run: bash scripts/release/prepare-assets.sh artifacts/arch-guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TryArch-guest
          path: |
            artifacts/arch-guest/*
            !artifacts/arch-guest/rootfs.ext4
